name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android platform files are generated fresh on every build, then adjusted.
      - name: Generate Android project
        run: flutter create --org com.mayerloh --project-name receipt_tracker --platforms=android .

      - name: Adjust Android project
        run: |
          manifest=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$manifest" || \
            sed -i '0,/<application/s##<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$manifest"
          sed -i 's/android:label="receipt_tracker"/android:label="Receipts"/' "$manifest"
          gradle=$(ls android/app/build.gradle.kts android/app/build.gradle 2>/dev/null | head -1)
          sed -i -E 's/minSdk(Version)? *=? *flutter\.minSdkVersion/minSdk = 26/' "$gradle"
          grep -n "minSdk\|applicationId" "$gradle"

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - run: flutter build apk --release

      - name: Sign with the app key
        env:
          KS_PASS: receipts-local
        run: |
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$bt/apksigner" sign --ks android-signing/receipts.jks --ks-key-alias receipts \
            --ks-pass "pass:$KS_PASS" --key-pass "pass:$KS_PASS" \
            --out receipt-tracker.apk build/app/outputs/flutter-apk/app-release.apk
          "$bt/apksigner" verify --print-certs receipt-tracker.apk | head -5

      - name: Publish build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Build ${{ github.run_number }}
          body: Download receipt-tracker.apk below and open it on your phone to install or update.
          files: receipt-tracker.apk
