name: receipt_tracker
description: Mel's receipt and expense tracker for the Life Dashboard.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  google_sign_in: ^7.2.0
  http: ^1.2.2
  flutter_secure_storage: ^9.2.2
  flutter_local_notifications: ^21.0.0
  google_mlkit_document_scanner: ^0.7.2
  image: ^4.5.4
  sqflite: ^2.4.1
  path_provider: ^2.1.5
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
